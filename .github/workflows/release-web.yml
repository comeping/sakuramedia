name: Release Web Docker

on:
  workflow_call:
  workflow_dispatch:
  # push 主分支自动发布：覆盖 latest + main + sha-xxx
  # push v* tag 由 release.yml 通过 workflow_call 调起：覆盖 latest + <tag> + sha-xxx
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push-web-image:
    name: Build and push web Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests before release
        run: flutter test

      - name: Build Flutter web release
        # --no-web-resources-cdn: 把 canvaskit 打进产物从同源加载, 避免国内访问 gstatic.com 失败。
        shell: bash
        run: |
          # 从 git tag 注入版本：v0.3.7 -> 0.3.7；pubspec 的 version 仅占位，实际以 tag 为准
          # push 分支时无 v* tag，用 commit short sha 作为 build-name
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          flutter build web --release --no-web-resources-cdn --build-name="$VERSION"

      - name: Resolve Docker image name
        id: image
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          raw_image="$DOCKERHUB_IMAGE"
          if [ -z "$raw_image" ]; then
            raw_image="$DOCKERHUB_USERNAME/sakuramedia-web"
          fi

          if [ -z "$raw_image" ]; then
            echo "::error::Missing DOCKERHUB_IMAGE variable and DOCKERHUB_USERNAME secret."
            exit 1
          fi

          image="$(printf '%s' "$raw_image" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Using Docker image: $image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
